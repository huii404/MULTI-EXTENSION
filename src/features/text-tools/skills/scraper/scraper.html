<div class="scraper-container">
  <!-- MODE SELECTOR -->
  <div class="form-group" style="margin-bottom: 10px;">
    <label style="font-size: 12px; font-weight: 700; color: var(--text);">🎯 Chế độ Cào Ngầm:</label>
    <select id="scraper-mode" class="form-control" style="width: 100%; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12px; background: var(--surface); color: var(--text);">
      <option value="multi-platform" selected>🌐 Cào Đa Nền Tảng (Google, Bing, DuckDuckGo, Wikipedia)</option>
      <option value="open-tabs">📄 Cào các Tab đang mở</option>
      <option value="batch-urls">🔗 Danh sách URLs nhập vào</option>
    </select>
  </div>

  <!-- KEYWORD INPUT -->
  <div class="form-group" style="margin-bottom: 10px;">
    <label style="font-size: 12px; font-weight: 700; color: var(--text);">🔑 Từ khóa cần thu thập (Keyword):</label>
    <input type="text" id="scraper-keyword" placeholder="Nhập từ khóa (Ví dụ: lừa đảo, dự án A, giá vàng...)" style="width: 100%; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12px; font-family: inherit;">
  </div>

  <!-- BATCH URLS INPUT (Conditional for batch-urls) -->
  <div id="scraper-urls-group" class="form-group" style="margin-bottom: 10px; display: none;">
    <label style="font-size: 12px; font-weight: 700; color: var(--text);">🔗 Danh sách URL (Mỗi URL 1 dòng):</label>
    <textarea id="scraper-urls-input" rows="3" placeholder="https://dantri.com.vn/article-1.htm&#10;https://vnexpress.net/article-2.html" style="width: 100%; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 11px; font-family: monospace;"></textarea>
  </div>

  <!-- LIMIT SELECTOR (Conditional for multi-platform) -->
  <div id="scraper-limit-group" class="form-group" style="margin-bottom: 10px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label style="font-size: 12px; font-weight: 700; color: var(--text); margin:0;">📊 Số trang mục tiêu tối đa:</label>
      <select id="scraper-limit" style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px;">
        <option value="5">5 trang</option>
        <option value="10" selected>10 trang</option>
        <option value="20">20 trang</option>
        <option value="50">50 trang</option>
      </select>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div style="display: flex; gap: 8px; margin-bottom: 12px;">
    <button id="scraper-start-btn" class="action-btn primary" style="flex: 1; padding: 10px; background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 0;">
      <span>▶️ Bắt đầu Cào Ngầm</span>
    </button>
    
    <button id="scraper-pause-btn" class="action-btn secondary" style="flex: 0.6; padding: 10px; margin-bottom: 0; opacity: 0.5; pointer-events: none;">
      <span>⏸️ Tạm dừng</span>
    </button>
    
    <button id="scraper-clear-btn" class="action-btn secondary" style="flex: 0.5; padding: 10px; margin-bottom: 0;">
      <span>🗑️ Xóa Vault</span>
    </button>
  </div>

  <!-- PROGRESS STATUS BAR -->
  <div id="scraper-status-bar" style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 12px; display: none;">
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 6px;">
      <span id="scraper-status-text">⏳ Đang khởi chạy...</span>
      <span id="scraper-progress-count">0/0</span>
    </div>
    <div style="width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;">
      <div id="scraper-progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.3s ease;"></div>
    </div>
  </div>

  <!-- VAULT HEADER & COUNTER -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <span style="font-size: 12px; font-weight: 700; color: var(--text);">
      📦 Kho Bằng Chứng (<span id="scraper-vault-count" style="color: #10b981;">0</span>)
    </span>
    <span style="font-size: 10px; color: var(--text-muted);">Tự động lưu ngầm</span>
  </div>

  <!-- EXPORT BUTTONS (TXT, EXCEL, WORD) -->
  <div style="display: flex; gap: 6px; margin-bottom: 12px;">
    <button id="scraper-export-txt-btn" class="action-btn secondary" style="flex: 1; padding: 7px 4px; font-size: 11px; margin-bottom: 0; background: #f8fafc;">
      📄 Xuất TXT
    </button>
    <button id="scraper-export-excel-btn" class="action-btn primary" style="flex: 1.2; padding: 7px 4px; font-size: 11px; margin-bottom: 0; background: #16a34a;" title="Tự xuống dòng & Co giãn cột thông minh">
      📊 Xuất Excel (.xlsx)
    </button>
    <button id="scraper-export-word-btn" class="action-btn primary" style="flex: 1; padding: 7px 4px; font-size: 11px; margin-bottom: 0; background: #2563eb;">
      📝 Xuất Word (.doc)
    </button>
  </div>

  <!-- EVIDENCE LIST PREVIEW -->
  <div id="scraper-evidence-list" class="evidence-list-container" style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
    <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 11px;">
      💡 Nhập từ khóa và chọn chế độ cào ngầm để thu thập văn bản & bằng chứng tự động.
    </div>
  </div>
</div>
