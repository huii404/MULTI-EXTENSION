<div class="course-register-box" style="display: flex; flex-direction: column; gap: 10px;">
  <!-- Ô nhập mã môn / mã lớp -->
  <div class="form-group" style="margin-bottom: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
      <label style="margin: 0; font-size: 12px; font-weight: 700; color: var(--text);">
        <span class="icon">📝</span> Mã lớp / môn học cần chọn:
      </label>
      <span id="dtu-saved-badge" style="font-size: 10px; color: #10b981; font-weight: 600; opacity: 0; transition: opacity 0.2s;">✓ Đã lưu</span>
    </div>
    <textarea id="dtu-course-list" rows="3" placeholder="Nhập các mã cần đăng ký (phân cách bằng dấu phẩy hoặc xuống dòng)&#10;Ví dụ: CS 417 I, ENG 101 A, 272183" style="font-size: 12px; resize: none; line-height: 1.4; padding: 8px 10px;"></textarea>
  </div>

  <!-- Tùy chọn săn môn thông minh (Anti-Spam) -->
  <div style="background: rgba(41, 128, 185, 0.06); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid rgba(41, 128, 185, 0.18);">
    <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin: 0; font-size: 11px; font-weight: 600; color: #1e3a8a;">
      <span>🔄 Tự động quét lại săn slot nếu lớp hết chỗ (chu kỳ an toàn 3.5s)</span>
      <input type="checkbox" id="dtu-hunt-mode" style="width: 15px; height: 15px; cursor: pointer; accent-color: #2980b9; margin-left: 8px;">
    </label>
  </div>

  <!-- Nút hành động chính -->
  <div style="display: flex; gap: 8px;">
    <button id="dtu-start-register-btn" class="action-btn primary" style="background: linear-gradient(135deg, #2980b9, #3498db); justify-content: center; text-align: center; padding: 10px; margin-bottom: 0;">
      <span style="font-size: 13px; font-weight: 700;">🚀 Tự động chọn lớp & Focus Captcha</span>
    </button>
    <button id="dtu-stop-register-btn" class="action-btn" style="background: #e74c3c; color: white; justify-content: center; text-align: center; padding: 10px; margin-bottom: 0; display: none;">
      <span style="font-size: 13px; font-weight: 700;">⏹️ Dừng tìm kiếm</span>
    </button>
  </div>

  <!-- Thanh trạng thái tinh gọn (Status Banner) -->
  <div id="dtu-register-status" style="padding: 8px 10px; background: var(--surface); border-radius: var(--radius-sm); font-size: 11px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
    <span id="dtu-status-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0;"></span>
    <span id="dtu-status-text" style="color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;">
      Đang kiểm tra tab MyDTU...
    </span>
  </div>
</div>
