<div class="dtu-hub">
  <!-- Danh sách các skill -->
  <div id="dtu-skill-list">
    <!-- Skill 1: Đánh giá giảng viên -->
    <button class="dtu-skill-btn" data-skill="rating" style="border-left: 4px solid #d52b1e;">
      <div class="dtu-skill-icon" style="background: linear-gradient(135deg, #d52b1e, #ff6b6b);">
        ⭐
      </div>
      <div class="dtu-skill-info">
        <span class="dtu-skill-title">Đánh giá giảng viên</span>
        <span class="dtu-skill-desc">Tự động điền form khảo sát giảng viên (câu 1-53)</span>
      </div>
      <span class="dtu-skill-arrow">›</span>
    </button>

    <!-- Skill 2: Xuất Lịch Học (MỚI) -->
    <button class="dtu-skill-btn" data-skill="schedule" style="border-left: 4px solid #27ae60;">
      <div class="dtu-skill-icon" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">
        📅
      </div>
      <div class="dtu-skill-info">
        <span class="dtu-skill-title">Xuất lịch học MyDTU(comming soon)</span>
        <span class="dtu-skill-desc">Tải lịch học kỳ/tháng/tuần dạng .ICS, .CSV, .PDF</span>
      </div>
      <span class="dtu-skill-arrow">›</span>
    </button>

    <!-- Skill 3: Đăng ký môn -->
    <button class="dtu-skill-btn" data-skill="grade" style="border-left: 4px solid #2980b9;">
      <div class="dtu-skill-icon" style="background: linear-gradient(135deg, #2980b9, #3498db);">
        📊
      </div>
      <div class="dtu-skill-info">
        <span class="dtu-skill-title">Đăng ký môn (Coming Soon)</span>
        <span class="dtu-skill-desc">Xem điểm và hỗ trợ đăng ký môn</span>
      </div>
      <span class="dtu-skill-arrow">›</span>
    </button>

    <div id="dtu-skill-content" style="display:none; margin-top:12px; padding-top:12px;">
      <div id="dtu-skill-body"></div>
    </div>

  </div>

</div>
