{% extends "layout.html" %}
{% block content %}
<style>
    .admin-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .nav-tabs .nav-link { color: #64748b; font-weight: 500; border: none; padding: 12px 20px; }
    .nav-tabs .nav-link.active { color: #0ea5e9; border-bottom: 3px solid #0ea5e9; background: transparent; }
</style>

<div class="row mb-4">
    <div class="col-12"><h3 class="fw-bold text-dark border-start border-4 border-primary ps-3">Dashboard Quản Trị</h3></div>
</div>

<ul class="nav nav-tabs mb-4 shadow-sm bg-white rounded-3 px-3">
    <li class="nav-item"><a class="nav-link" href="/admin"><i class="bi bi-pie-chart-fill me-2"></i>Tổng quan</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/alerts"><i class="bi bi-bell-fill me-2"></i>Cảnh báo đỏ</a></li>
    <li class="nav-item"><a class="nav-link active" href="/admin/chatlogs"><i class="bi bi-robot me-2"></i>Lịch sử Chatbot</a></li>
    <li class="nav-item ms-auto">
        <a class="nav-link text-danger" href="/logout"><i class="bi bi-box-arrow-right me-1"></i> Đăng xuất</a>
    </li>
</ul>

<div class="card admin-card border-top border-4 border-info">
    <div class="card-header bg-transparent fw-bold border-0 py-3 d-flex justify-content-between align-items-center">
        <div>
            <i class="bi bi-robot me-2 text-info"></i>Giám sát Lịch sử Tâm sự AI
            <span class="badge bg-info text-dark rounded-pill ms-2" id="chatCount">0</span>
        </div>
        <button class="btn btn-sm btn-success shadow-sm" onclick="exportToCSV()">
            <i class="bi bi-file-earmark-arrow-down me-1"></i> Xuất file CSV
        </button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
            <table class="table table-hover mb-0">
                <thead class="table-light text-muted"><tr><th class="ps-4">Thời gian</th><th>Học sinh nói</th><th>AI phản hồi</th></tr></thead>
                <tbody id="chatTableBody"><tr><td colspan="3" class="text-center py-4">Đang tải dữ liệu...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    function formatTime(isoString) { 
        const d = new Date(isoString); 
        return d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + ' - ' + d.toLocaleDateString('vi-VN'); 
    }
    
    const badWords = ['tự tử', 'chết', 'tuyệt vọng', 'đánh nhau', 'bắt nạt', 'áp lực', 'trầm cảm', 'tự kỷ', 'bỏ nhà', 'chán sống'];
    
    function highlight(text) {
        let txt = text;
        badWords.forEach(kw => {
            const regex = new RegExp(`(${kw})`, 'gi');
            txt = txt.replace(regex, `<span class="bg-warning text-danger fw-bold px-1 rounded">$1</span>`);
        });
        return txt;
    }

    async function loadChatLogs() {
        const res = await fetch('/api/admin/chat-logs');
        const logs = await res.json();
        document.getElementById('chatCount').innerText = logs.length + " tin nhắn";
        const tbody = document.getElementById('chatTableBody');
        
        if (logs.length === 0) { tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4">Chưa có lịch sử.</td></tr>`; return; }

        let html = '';
        logs.forEach(log => {
            const isBad = badWords.some(kw => log.user_msg.toLowerCase().includes(kw));
            html += `<tr><td class="ps-4 small">${formatTime(log.timestamp)}</td><td><span class="${isBad ? 'fw-bold' : ''}">${highlight(log.user_msg)}</span></td><td class="small">${marked.parse(log.ai_reply)}</td></tr>`;
        });
        tbody.innerHTML = html;
    }

    async function exportToCSV() {
        try {
            const res = await fetch('/api/admin/chat-logs');
            const logs = await res.json();
            
            if (logs.length === 0) {
                alert("Chưa có dữ liệu để xuất file!");
                return;
            }

            let csvContent = "\uFEFF"; 
            csvContent += "Thời gian,Học sinh nói,AI phản hồi\n";

            logs.forEach(log => {
                let time = formatTime(log.timestamp);
                
                let userMsg = `"${log.user_msg.replace(/"/g, '""')}"`;
                let aiReply = `"${log.ai_reply.replace(/"/g, '""')}"`;
                
                csvContent += `${time},${userMsg},${aiReply}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            const fileName = `Lich_su_Chatbot_${new Date().toISOString().slice(0,10)}.csv`;
            
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        } catch (error) {
            console.error("Lỗi khi xuất file:", error);
            alert("Có lỗi xảy ra khi xuất file!");
        }
    }

    document.addEventListener("DOMContentLoaded", loadChatLogs);
</script>
{% endblock %}
