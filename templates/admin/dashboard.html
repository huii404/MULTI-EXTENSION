{% extends "layout.html" %}

{% block content %}
<style>
    .admin-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .icon-box { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .nav-tabs .nav-link { color: #64748b; font-weight: 500; border: none; padding: 12px 20px; }
    .nav-tabs .nav-link.active { color: #0ea5e9; border-bottom: 3px solid #0ea5e9; background: transparent; }
</style>

<div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-bold text-dark border-start border-4 border-primary ps-3">Dashboard Quản Trị</h3>
            <p class="text-muted ps-3 mb-0">Hệ thống quản lý sức khỏe tinh thần học đường</p>
        </div>
        <button class="btn btn-outline-secondary" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Cập nhật</button>
    </div>
</div>

<ul class="nav nav-tabs mb-4 shadow-sm bg-white rounded-3 px-3">
    <li class="nav-item"><a class="nav-link active" href="/admin"><i class="bi bi-pie-chart-fill me-2"></i>Tổng quan</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/alerts"><i class="bi bi-bell-fill me-2"></i>Cảnh báo đỏ</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/chatlogs"><i class="bi bi-robot me-2"></i>Lịch sử Chatbot</a></li>
    <li class="nav-item ms-auto">
        <a class="nav-link text-danger" href="/logout"><i class="bi bi-box-arrow-right me-1"></i> Đăng xuất</a>
    </li>
</ul>

<div class="row g-4 mb-4">
    <div class="col-md-4"><div class="card admin-card p-3"><div class="d-flex align-items-center"><div class="icon-box bg-primary bg-opacity-10 text-primary me-3"><i class="bi bi-activity"></i></div><div><h6 class="text-muted mb-1">Tổng lượt đo</h6><h3 class="fw-bold mb-0" id="totalScans">0</h3></div></div></div></div>
    <div class="col-md-4"><div class="card admin-card p-3"><div class="d-flex align-items-center"><div class="icon-box bg-warning bg-opacity-10 text-warning me-3"><i class="bi bi-speedometer2"></i></div><div><h6 class="text-muted mb-1">Stress trung bình</h6><h3 class="fw-bold mb-0"><span id="avgStress">0</span>%</h3></div></div></div></div>
    <div class="col-md-4"><div class="card admin-card p-3"><div class="d-flex align-items-center"><div class="icon-box bg-danger bg-opacity-10 text-danger me-3"><i class="bi bi-exclamation-triangle-fill"></i></div><div><h6 class="text-muted mb-1">Cảnh báo nguy hiểm</h6><h3 class="fw-bold mb-0 text-danger" id="highRiskCases">0</h3></div></div></div></div>
</div>

<div class="row g-4">
    <div class="col-lg-5"><div class="card admin-card h-100"><div class="card-body" style="height: 300px;"><canvas id="distributionChart"></canvas></div></div></div>
    <div class="col-lg-7"><div class="card admin-card h-100"><div class="card-body" style="height: 300px;"><canvas id="trendChart"></canvas></div></div></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async function() {
        try {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            document.getElementById('totalScans').innerText = data.summary.total_scans;
            document.getElementById('avgStress').innerText = data.summary.avg_stress;
            document.getElementById('highRiskCases').innerText = data.summary.high_risk_cases;

            new Chart(document.getElementById('distributionChart').getContext('2d'), {
                type: 'doughnut', data: { labels: ['Ổn định', 'Căng thẳng nhẹ', 'Nguy hiểm'], datasets: [{ data: [data.distribution.low, data.distribution.medium, data.distribution.high], backgroundColor: ['#22c55e', '#f97316', '#dc2626'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false }
            });
            new Chart(document.getElementById('trendChart').getContext('2d'), {
                type: 'line', data: { labels: data.trend.labels.length ? data.trend.labels : ['Hôm nay'], datasets: [{ label: 'Stress trung bình (%)', data: data.trend.data.length ? data.trend.data : [0], borderColor: '#0ea5e9', fill: true, tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false }
            });
        } catch(e) { console.error(e); }
    });
</script>
{% endblock %}
