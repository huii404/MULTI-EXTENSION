{% extends "layout.html" %}
{% block content %}
<style>
    .admin-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .nav-tabs .nav-link { color: #64748b; font-weight: 500; border: none; padding: 12px 20px; }
    .nav-tabs .nav-link.active { color: #0ea5e9; border-bottom: 3px solid #0ea5e9; background: transparent; }
</style>

<div class="row mb-4">
    <div class="col-12"><h3 class="fw-bold text-dark border-start border-4 border-primary ps-3">Dashboard Quản Trị</h3></div>
</div>

<ul class="nav nav-tabs mb-4 shadow-sm bg-white rounded-3 px-3">
    <li class="nav-item"><a class="nav-link" href="/admin"><i class="bi bi-pie-chart-fill me-2"></i>Tổng quan</a></li>
    <li class="nav-item"><a class="nav-link active" href="/admin/alerts"><i class="bi bi-bell-fill me-2"></i>Cảnh báo đỏ</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/chatlogs"><i class="bi bi-robot me-2"></i>Lịch sử Chatbot</a></li>
    <li class="nav-item ms-auto">
        <a class="nav-link text-danger" href="/logout"><i class="bi bi-box-arrow-right me-1"></i> Đăng xuất</a>
    </li>
</ul>

<div class="card admin-card">
    <div class="card-header bg-transparent fw-bold border-0 py-3 d-flex justify-content-between align-items-center">
        <span><i class="bi bi-bell-fill me-2 text-danger"></i>Danh sách Cảnh báo đỏ</span>
        <span class="badge bg-danger rounded-pill" id="alertCount">0 ca</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light text-muted"><tr><th class="ps-4">Thời gian</th><th>Chỉ số Stress</th><th>Cảm xúc</th><th>Trạng thái</th><th class="text-end pe-4">Hành động</th></tr></thead>
                <tbody id="alertsTableBody"><tr><td colspan="5" class="text-center py-4">Đang tải dữ liệu...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function formatTime(isoString) { const d = new Date(isoString); return d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + ' - ' + d.toLocaleDateString('vi-VN'); }
    async function loadAlerts() {
        const res = await fetch('/api/admin/alerts');
        const alerts = await res.json();
        document.getElementById('alertCount').innerText = alerts.length + " ca";
        const tbody = document.getElementById('alertsTableBody');
        if (alerts.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-success">Không có cảnh báo.</td></tr>`; return; }
        
        let html = '';
        alerts.forEach(a => {
            const isRes = a.status === 'resolved';
            const statusHtml = isRes ? `<span class="badge bg-success bg-opacity-10 text-success">Đã xử lý</span>` : `<span class="badge bg-warning bg-opacity-10 text-warning">Chờ can thiệp</span>`;
            const btnHtml = isRes ? `<button class="btn btn-sm btn-light" disabled>Hoàn tất</button>` : `<button class="btn btn-sm btn-primary" onclick="markResolved('${a.id}')">Xử lý</button>`;
            html += `<tr><td class="ps-4">${formatTime(a.timestamp)}</td><td><b class="text-danger">${a.stress}%</b></td><td>${a.emotion}</td><td>${statusHtml}</td><td class="text-end pe-4">${btnHtml}</td></tr>`;
        });
        tbody.innerHTML = html;
    }
    async function markResolved(id) {
        if(!confirm("Xác nhận đã xử lý?")) return;
        await fetch('/api/admin/alerts/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: id}) });
        loadAlerts();
    }
    document.addEventListener("DOMContentLoaded", loadAlerts);
</script>
{% endblock %}
