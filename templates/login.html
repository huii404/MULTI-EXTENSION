<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - BioGate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0ea5e9;
            background-color: #fff;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            background: #0ea5e9;
            border: none;
        }
        .btn-login:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold text-dark">Hệ thống Quản trị</h4>
            <p class="text-muted small">Vui lòng đăng nhập để tiếp tục</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 small text-center rounded-3 py-2">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập tài khoản..." required autocomplete="off">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm">
                Đăng nhập hệ thống <i class="bi bi-arrow-right ms-1"></i>
            </button>
            
            <div class="text-center mt-4">
                <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-house-door"></i> Quay lại trang chủ học sinh</a>
            </div>
        </form>
    </div>

</body>
</html>
