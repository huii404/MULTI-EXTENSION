<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioGate Lab – Đề tài NCKH THCS Ngô Quyền</title>
    <meta name="theme-color" content="#f5f9ff">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>body{display:flex;flex-direction:column}main{flex:1}</style>
</head>
<body>
    <a class="skip-link" href="#mainContent">Đi thẳng đến nội dung</a>

    <nav class="school-header" id="mainHeader">
        <div class="container header-content">
            <a href="/" class="btn-home" title="Về trang đo">
                <i class="bi bi-house-door-fill fs-5"></i>
            </a>

            <div class="school-logo-text">
                <h4 class="school-name">BioGate Lab · THCS Ngô Quyền</h4>
                <div class="project-name d-none d-md-block"> 
                    Đề tài NCKH: Công nghệ hỗ trợ sức khỏe tinh thần học đường
                </div>
            </div>

            <div class="d-flex gap-2">
                <a href="/#how-it-works" class="header-link" title="Xem cách hệ thống hoạt động">
                    <i class="bi bi-diagram-3-fill"></i><span>Cách hoạt động</span>
                </a>

                <button onclick="closeHeader()" class="btn-home d-none d-lg-flex" title="Ẩn thanh tiêu đề" aria-label="Ẩn thanh tiêu đề">
                    <i class="bi bi-x-lg fs-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="mainContent">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 text-muted bg-light mt-auto border-top">
        <div class="container">
            <small><strong>BioGate Lab · Nhóm học sinh THCS Ngô Quyền</strong> · Sản phẩm nghiên cứu khoa học, không thay thế tư vấn y tế.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function closeHeader() {
            const header = document.getElementById('mainHeader');
        
            header.style.transform = 'translateY(-100%)';
            
            setTimeout(() => {
                header.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
