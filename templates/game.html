{% extends "layout.html" %}

{% block content %}
<style>
    .power-meter { width: min(100%, 420px); height: 30px; background: #e6edf5; border-radius: 15px; position: relative; overflow: hidden; }
    .game-area { min-height: 320px; background: linear-gradient(180deg, #eef8ff, #fff7ed); border: 1px solid #dfeaf5; border-radius: 20px; overflow: hidden; }
    @media (max-width: 576px) { .game-area { min-height: 280px; } }
</style>

<section class="page-hero text-center">
    <span class="eyebrow"><i class="bi bi-controller"></i> Nghỉ giải lao</span>
    <h1>Ném giấy vui</h1>
    <p class="mx-auto">Canh thanh lực vào vùng xanh rồi nhấn nút ném. Cùng xem bạn ghi được bao nhiêu điểm!</p>
</section>

<div class="card card-custom p-3 p-md-4 text-center mx-auto" style="max-width:850px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted fw-bold">Mục tiêu: vùng màu xanh</span>
        <span class="badge rounded-pill bg-primary fs-6">Điểm: <span id="score">0</span></span>
    </div>

    <div class="game-area position-relative">
        <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 80px;">
            🗑️
        </div>
        
        <div id="paperBall" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 40px; transition: all 0.5s ease;">
            📄
        </div>

        <h2 id="gameResult" aria-live="polite" style="position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); display: none;" class="fw-bold"></h2>
    </div>

    <div class="power-meter mt-4 mx-auto" aria-label="Thanh lực">
        <div style="position: absolute; left: 40%; width: 20%; height: 100%; background: #4ade80;"></div> 
        <div id="powerBar" style="width: 10px; height: 100%; background: #e34f5b; position: absolute; left: 0;"></div>
    </div>

    <button onclick="throwPaper()" class="btn btn-pastel-pink btn-lg mt-3 mx-auto d-block px-5">NÉM NGAY!</button>
</div>

<script>
    const soundThrow = new Audio("{{ url_for('static', filename='audio/throw.mp3') }}");
    const soundWin   = new Audio("{{ url_for('static', filename='audio/win.mp3') }}");
    const soundFail  = new Audio("{{ url_for('static', filename='audio/fail.mp3') }}");

    soundThrow.volume = 0.5;
    soundWin.volume = 0.6;
    soundFail.volume = 0.6;

    let bar = document.getElementById('powerBar');
    let paper = document.getElementById('paperBall');
    let resultText = document.getElementById('gameResult');
    
    let pos = 0;
    let direction = 1;
    let running = true;
    let score = 0;

    setInterval(() => {
        if (!running) return;
        pos += 3 * direction;
        const maxPosition = bar.parentElement.clientWidth - bar.offsetWidth;
        if (pos >= maxPosition || pos <= 0) direction *= -1;
        pos = Math.max(0, Math.min(maxPosition, pos));
        bar.style.left = pos + 'px';
    }, 10);

    function throwPaper() {
        if (!running) return;
        running = false;
        soundThrow.currentTime = 0; 
        soundThrow.play();

        const trackWidth = bar.parentElement.clientWidth;
        let isHit = (pos >= trackWidth * 0.4 && pos <= trackWidth * 0.6);

        paper.style.bottom = "150px";
        paper.style.transform = "translateX(-50%) scale(0.5) rotate(720deg)"; 
        
        setTimeout(() => {
            if (isHit) {
                soundWin.currentTime = 0;
                soundWin.play();

                resultText.innerText = "TRÚNG RỒI! 🎉";
                resultText.className = "fw-bold text-success display-4";
                resultText.style.display = "block";
                
                score += 10;
                document.getElementById('score').innerText = score;
            } else {
                soundFail.currentTime = 0;
                soundFail.play();

                resultText.innerText = "HỤT RỒI... 😅";
                resultText.className = "fw-bold text-secondary display-4";
                resultText.style.display = "block";
                
                paper.style.transition = "all 0.2s ease";
                paper.style.bottom = "20px";
                paper.style.left = "20%"; 
            }

            setTimeout(() => {
                running = true;
                
                paper.style.transition = "none"; 
                paper.style.bottom = "20px";
                paper.style.left = "50%";
                paper.style.transform = "translateX(-50%) rotate(0deg)";
                
                setTimeout(() => { paper.style.transition = "all 0.5s ease"; }, 50);

                resultText.style.display = "none";
            }, 1500);

        }, 500);
    }
</script>
{% endblock %}
